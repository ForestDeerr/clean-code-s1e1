<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" MEDIA="screen" charset="utf-8">
</head>

<body class="page">

  <section class="info">
    <img src="./eisenhower-matrix.jpg" class="info__img"
      alt="Eisenhower Matrix">
    <a class="info__more" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </section>

  <section id="add-task" class="new-task">
    <label class="new-task__label">Add Item</label>
    <div class="new-task__row">
      <input id="new-task"
        class="new-task__input">
      <button class="btn new-task__btn" >Add</button>
    </div>
  </section>

  <section class="todo-list">
    <label class="todo-list__label">Todo</label>
    <ul class="todo-list__items task-list" id="incomplete-tasks">
      <li class="todo-list__item task-item">
        <input type="checkbox" class="todo-list__checkbox checkbox">
        <label class="todo-list__item--disabled task">Pay Bills</label>
        <input class="todo-list__input-task task" type="text">
        <button class="todo-list__btn-edit btn">Edit</button>
        <button class="todo-list__btn-delete btn">
          <img class="btn__icon"
            src="./remove.svg"
            alt="delete task"
          >
        </button>
      </li>
      <li class="todo-list__item task-item edit-mode">
        <input type="checkbox" class="todo-list__checkbox checkbox">
        <label class="todo-list__item--disabled task">Go Shopping</label>
        <input class="todo-list__input-task task"
          type="text"
          value="Go Shopping"
        >
        <button class="todo-list__btn-edit btn">Save</button>
        <button class="todo-list__btn-delete btn">
          <img class="btn__icon"
            src="./remove.svg"
            alt="delete task"
          >
        </button>
      </li>
    </ul>
  </section>

  <section class="completed-list">
    <label class="completed-list__label">Completed</label>
    <ul class="task-list" id="completed-tasks">
      <li class="todo-list__item task-item">
        <input type="checkbox" class="todo-list__checkbox checkbox" checked>
        <label class="todo-list__item--disabled task">See the Doctor</label>
        <input class="todo-list__input-task task" type="text">
        <button class="todo-list__btn-edit btn">Edit</button>
        <button class="todo-list__btn-delete btn">
          <img class="btn__icon"
            src="./remove.svg"
            alt="delete task"
          >
        </button>
      </li>
    </ul>
  </section>

  <script SRC="app.js"></script>
</body>
</html>
