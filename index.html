<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" MEDIA="screen" charset="utf-8">
</head>

<body class="page">

  <section class="info">
    <img src="./eisenhower-matrix.jpg">
    <a class="more-inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </section>

  <section id="add-task">
    <label class="label-task">Add Item</label>
    <div class="task-row-wrapper">
      <input id="new-task"
        class="task add-task">
      <button class="btn" >Add</button>
    </div>
  </section>

  <section class="todo-list">
    <label class="label-task">Todo</label>
    <ul class="task-list" id="incomplete-tasks">
      <li class="task-item">
        <input type="checkbox" class="checkbox">
        <label class="task disabled">Pay Bills</label>
        <input type="text" class="task input-task">
        <button class="btn edit">Edit</button>
        <button class="btn btn--delete"><img src="./remove.svg"></button>
      </li>
      <li class="task-item edit-mode">
        <input type="checkbox" class="checkbox">
        <label class="task disabled">Go Shopping</label>
        <input type="text"
          value="Go Shopping"
          class="task input-task">
        <button class="btn edit">Save</button>
        <button class="btn btn--delete">
            <img src="./remove.svg">
        </button>
      </li>
    </ul>
  </section>

  <section class="completed-list">
    <label class="label-task">Completed</label>
    <ul class="task-list" id="completed-tasks">
      <li class="task-item">
        <input type="checkbox" class="checkbox" checked>
        <label class="task disabled">See the Doctor</label>
        <input type="text" class="task input-task">
        <button class="btn edit">Edit</button>
        <button class="btn btn--delete">
          <img src="./remove.svg">
        </button>
      </li>
    </ul>
  </section>

  <script SRC="app.js"></script>
</body>
</html>
